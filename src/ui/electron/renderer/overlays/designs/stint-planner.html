<div
  class="{{rootClass}}"
  style="width: 400px; height: 176px; box-sizing: border-box; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 2000px rgba(10, 12, 15, {{panelAlpha}}); font-family: 'Barlow Semi Condensed', system-ui, sans-serif; color: #F2F4F6; text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 1px rgba(0,0,0,0.9); display: flex; flex-direction: column; gap: 10px; padding: 10px 14px 12px"
>
  <div
    style="display: flex; align-items: baseline; justify-content: space-between"
  >
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em"
      >STINT</span
    >
    <div
      data-column="pit"
      style="display: flex; align-items: baseline; gap: 6px"
    >
      <span
        style="
          font-size: 11px;
          font-weight: 600;
          color: #c2c9d0;
          letter-spacing: 0.06em;
        "
        >BOX IN</span
      >
      <span
        class="mono"
        style="font-size: 18px; font-weight: 700; color: #ffc062"
        >{{boxLaps}} laps</span
      >
      <span
        class="mono"
        style="font-size: 11px; font-weight: 500; color: #c2c9d0"
        >{{boxLap}}</span
      >
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 7px">
    <sc-for list="{{res}}" as="r" hint-placeholder-count="2">
      <div
        data-column="{{r.key}}"
        style="
          display: grid;
          grid-template-columns: 54px minmax(0, 1fr) 64px;
          align-items: center;
          column-gap: 10px;
        "
      >
        <span
          style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: {{r.labelFg}}"
          >{{r.label}}</span
        >
        <div
          style="
            position: relative;
            height: 12px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.5);
            overflow: hidden;
          "
        >
          <div
            style="width: 100%; height: 100%; transform-origin: left center; background: {{r.color}}; transform: scaleX({{r.frac}})"
          ></div>
        </div>
        <span
          class="mono"
          style="font-size: 13px; font-weight: 700; text-align: right; color: {{r.lapsFg}}"
          >{{r.laps}} laps</span
        >
      </div>
    </sc-for>
  </div>

  <div
    data-fluid-grid="true"
    style="
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    "
  >
    <div
      data-column="energyRate"
      style="display: flex; flex-direction: column; gap: 1px"
    >
      <span
        style="
          font-size: 11px;
          font-weight: 600;
          color: #c2c9d0;
          letter-spacing: 0.04em;
        "
        >VE / LAP</span
      >
      <span class="mono" style="font-size: 14px; font-weight: 700"
        >{{energyPer}}</span
      >
    </div>
    <div
      data-column="target"
      style="display: flex; flex-direction: column; gap: 1px"
    >
      <span
        style="
          font-size: 11px;
          font-weight: 600;
          color: #c2c9d0;
          letter-spacing: 0.04em;
        "
        >TARGET +1 LAP</span
      >
      <span
        class="mono"
        style="font-size: 14px; font-weight: 700; color: #7ee2a8"
        >{{target}}</span
      >
    </div>
    <div
      data-column="fuelRate"
      style="display: flex; flex-direction: column; gap: 1px"
    >
      <span
        style="
          font-size: 11px;
          font-weight: 600;
          color: #c2c9d0;
          letter-spacing: 0.04em;
        "
        >FUEL / LAP</span
      >
      <span class="mono" style="font-size: 14px; font-weight: 700"
        >{{fuelPer}}</span
      >
    </div>
  </div>
</div>
