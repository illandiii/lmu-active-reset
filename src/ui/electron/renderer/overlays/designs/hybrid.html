<div
  class="{{rootClass}}"
  style="width: 300px; height: 124px; box-sizing: border-box; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 2000px rgba(10, 12, 15, {{panelAlpha}}); font-family: 'Barlow Semi Condensed', system-ui, sans-serif; color: #F2F4F6; text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 1px rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 10px 12px"
>
  <div style="display: flex; align-items: center; gap: 8px">
    <span
      data-column="state"
      style="min-width: 56px; text-align: center; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-shadow: none; background: {{stateBg}}; color: {{stateFg}}"
      >{{state}}</span
    >
    <span
      data-column="power"
      class="mono"
      style="font-size: 13px; font-weight: 700"
      >{{kw}} kW</span
    >
    <span style="flex: 1"></span>
    <span
      data-column="trend"
      class="mono"
      style="font-size: 11px; font-weight: 700; color: {{trendFg}}"
      >{{trend}}/lap</span
    >
    <svg
      data-column="battery"
      width="18"
      height="11"
      sc-camel-view-box="0 0 18 11"
      aria-hidden="true"
    >
      <rect
        x="0.5"
        y="0.5"
        width="15"
        height="10"
        rx="2"
        fill="none"
        stroke="#C2C9D0"
      ></rect>
      <rect x="16" y="3.5" width="1.5" height="4" fill="#C2C9D0"></rect>
      <rect
        x="2"
        y="2"
        width="{{socW}}"
        height="7"
        rx="1"
        fill="#F2F4F6"
      ></rect>
    </svg>
    <span
      data-column="battery"
      class="mono"
      style="font-size: 15px; font-weight: 700"
      >{{socPct}}%</span
    >
  </div>
  <div
    data-column="bar"
    style="
      position: relative;
      height: 12px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.5);
      overflow: hidden;
    "
  >
    <div style="position: absolute; left: 0; top: 0; width: 50%; height: 100%">
      <div
        class="pl"
        style="width: 100%; height: 100%; background: #3DDC84; transform: scaleX({{regen}})"
      ></div>
    </div>
    <div
      style="position: absolute; left: 50%; top: 0; width: 50%; height: 100%"
    >
      <div
        class="pr"
        style="width: 100%; height: 100%; background: #4C8DFF; transform: scaleX({{deploy}})"
      ></div>
    </div>
    <div
      style="
        position: absolute;
        left: calc(50% - 1px);
        top: 0;
        width: 2px;
        height: 100%;
        background: #f2f4f6;
      "
    ></div>
  </div>
  <div
    data-column="recommendation"
    style="
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    "
  >
    <div style="display: flex; align-items: baseline; gap: 6px">
      <span
        style="
          font-size: 11px;
          font-weight: 600;
          color: #c2c9d0;
          letter-spacing: 0.04em;
        "
        >DEPLOY MAP</span
      >
      <span style="flex: 1"></span>
      <span
        class="mono"
        style="font-size: 12px; font-weight: 500; color: #c2c9d0"
        >{{current}}</span
      >
      <span style="font-size: 11px; color: #c2c9d0">→</span>
      <span
        class="mono"
        style="font-size: 15px; font-weight: 700; color: {{accent}}"
        >{{suggested}}</span
      >
      <span style="font-size: 11px; font-weight: 600; color: #c2c9d0"
        >to hold {{targetSoc}}%</span
      >
    </div>
    <div style="display: flex; gap: 2px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
        <span
          style="flex: 1; height: 6px; border-radius: 2px; box-sizing: border-box; background: {{s.bg}}; border: {{s.border}}"
        ></span>
      </sc-for>
    </div>
  </div>
</div>
