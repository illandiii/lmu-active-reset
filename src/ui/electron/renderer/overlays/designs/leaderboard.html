<div
  class="{{rootClass}}"
  style="width: 440px; height: 600px; box-sizing: border-box; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 2000px rgba(10, 12, 15, {{bgAlpha}}); font-family: 'Barlow Semi Condensed', system-ui, sans-serif; color: #F2F4F6; text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 1px rgba(0,0,0,0.9); display: flex; flex-direction: column; gap: 6px; padding: 8px"
>
  <div
    style="
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px 6px;
    "
  >
    <div style="display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.04em"
        >{{sessionName}}</span
      >
      <span style="font-size: 12px; font-weight: 500; color: #c2c9d0"
        >{{trackCars}}</span
      >
    </div>
    <div style="display: flex; align-items: baseline; gap: 14px">
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: flex-end;
          gap: 1px;
        "
      >
        <span
          style="
            font-size: 11px;
            font-weight: 600;
            color: #c2c9d0;
            letter-spacing: 0.06em;
          "
          >LAP</span
        >
        <span class="mono" style="font-size: 14px; font-weight: 700"
          >{{lap}}</span
        >
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: flex-end;
          gap: 1px;
        "
      >
        <span
          style="
            font-size: 11px;
            font-weight: 600;
            color: #c2c9d0;
            letter-spacing: 0.06em;
          "
          >REMAINING</span
        >
        <span class="mono" style="font-size: 14px; font-weight: 700"
          >{{remaining}}</span
        >
      </div>
    </div>
  </div>

  <sc-for list="{{classes}}" as="cl" hint-placeholder-count="4">
    <div
      class="ov-in"
      style="display: flex; flex-direction: column; border-radius: 8px; background: rgba(10, 12, 15, {{boxAlpha}}); border: 1px solid rgba(255,255,255,0.08); padding: 2px 0 4px; animation-delay: {{cl.delay}}"
    >
      <div
        style="
          display: flex;
          align-items: center;
          gap: 8px;
          height: 28px;
          padding: 0 10px;
        "
      >
        <span
          style="height: 18px; min-width: 30px; padding: 0 6px; box-sizing: border-box; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; color: #FFFFFF; text-shadow: 0 1px 1px rgba(0,0,0,0.35); background: {{cl.color}}"
          >{{cl.badge}}</span
        >
        <span style="font-size: 12px; font-weight: 500; color: #c2c9d0"
          >{{cl.count}} cars</span
        >
        <span style="flex: 1"></span>
        <span
          style="
            font-size: 11px;
            font-weight: 600;
            color: #c2c9d0;
            letter-spacing: 0.06em;
          "
          >BEST</span
        >
        <span
          class="mono"
          style="font-size: 12px; font-weight: 500; color: #cfa8ff"
          >{{cl.best}}</span
        >
      </div>
      <sc-for list="{{cl.rows}}" as="r" hint-placeholder-count="3">
        <sc-if value="{{r.sep}}" hint-placeholder-val="{{ false }}">
          <div
            style="
              height: 10px;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 3px;
            "
          >
            <span
              style="
                width: 3px;
                height: 3px;
                border-radius: 50%;
                background: #9aa3ad;
              "
            ></span>
            <span
              style="
                width: 3px;
                height: 3px;
                border-radius: 50%;
                background: #9aa3ad;
              "
            ></span>
            <span
              style="
                width: 3px;
                height: 3px;
                border-radius: 50%;
                background: #9aa3ad;
              "
            ></span>
          </div>
        </sc-if>
        <sc-if value="{{r.car}}" hint-placeholder-val="{{ true }}">
          <div
            style="display: grid; grid-template-columns: 24px 34px 28px minmax(0, 1fr) 70px 64px; align-items: center; column-gap: 8px; height: 26px; padding: 0 10px; background: {{r.bg}}"
          >
            <span
              class="mono"
              style="height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; text-shadow: none; background: {{r.posBg}}; color: {{r.posFg}}"
              >{{r.pos}}</span
            >
            <span
              class="mono"
              style="font-size: 12px; font-weight: 500; color: #c2c9d0"
              >#{{r.num}}</span
            >
            <div
              style="
                height: 22px;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <sc-if value="{{r.hasImg}}" hint-placeholder-val="{{ true }}">
                <img
                  src="{{r.img}}"
                  alt="{{r.makeName}}"
                  style="
                    width: 28px;
                    height: 22px;
                    object-fit: contain;
                    display: block;
                    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.6));
                  "
                />
              </sc-if>
              <sc-if value="{{r.noImg}}" hint-placeholder-val="{{ false }}">
                <span
                  style="
                    height: 16px;
                    width: 28px;
                    border-radius: 3px;
                    background: rgba(0, 0, 0, 0.55);
                    border: 1px solid rgba(255, 255, 255, 0.14);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 8px;
                    font-weight: 700;
                    color: #e2e6ea;
                    text-shadow: none;
                  "
                  >{{r.make}}</span
                >
              </sc-if>
            </div>
            <div
              style="display: flex; align-items: center; gap: 6px; min-width: 0"
            >
              <span
                style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{r.nameFg}}"
                >{{r.name}}</span
              >
              <sc-if value="{{r.pit}}" hint-placeholder-val="{{ false }}">
                <span
                  style="
                    font-size: 10px;
                    font-weight: 700;
                    letter-spacing: 0.06em;
                    padding: 1px 5px;
                    border-radius: 3px;
                    background: #f5a524;
                    color: #16181c;
                    text-shadow: none;
                  "
                  >PIT</span
                >
              </sc-if>
            </div>
            <span
              class="mono"
              style="font-size: 12px; font-weight: 500; text-align: right; color: {{r.lastFg}}"
              >{{r.last}}</span
            >
            <span
              class="mono"
              style="font-size: 12px; font-weight: 500; text-align: right; color: {{r.gapFg}}"
              >{{r.gap}}</span
            >
          </div>
        </sc-if>
      </sc-for>
    </div>
  </sc-for>
</div>
