<div
  class="{{rootClass}}"
  style="width: 360px; height: 262px; box-sizing: border-box; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 2000px rgba(10, 12, 15, {{panelAlpha}}); font-family: 'Barlow Semi Condensed', system-ui, sans-serif; color: #F2F4F6; text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 1px rgba(0,0,0,0.9); display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px"
>
  <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em"
    >TYRES</span
  >
  <div
    class="tyre-grid"
    style="
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    "
  >
    <sc-for list="{{tyres}}" as="t" hint-placeholder-count="4">
      <div
        aria-label="{{t.name}} tyre"
        style="
          display: flex;
          gap: 10px;
          padding: 8px;
          border-radius: 8px;
          background: rgba(0, 0, 0, 0.35);
        "
      >
        <div
          data-column="heat"
          aria-hidden="true"
          style="
            position: relative;
            width: 38px;
            flex: none;
            display: flex;
            gap: 2px;
            padding: 3px;
            box-sizing: border-box;
            border-radius: 8px;
            background: #15181d;
            border: 1px solid rgba(255, 255, 255, 0.22);
          "
        >
          <span
            style="flex: 1; border-radius: 3px; background: {{t.c0}}"
          ></span>
          <span
            style="flex: 1; border-radius: 3px; background: {{t.c1}}"
          ></span>
          <span
            style="flex: 1; border-radius: 3px; background: {{t.c2}}"
          ></span>
          <sc-if
            data-column="condition"
            value="{{t.marked}}"
            hint-placeholder-val="{{ false }}"
          >
            <span
              style="
                position: absolute;
                left: -3px;
                right: -3px;
                top: 44%;
                height: 7px;
                border-radius: 2px;
                background: #15181d;
                border: 1px solid rgba(255, 138, 128, 0.7);
              "
            ></span>
          </sc-if>
        </div>
        <div
          style="
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
          "
        >
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
            "
          >
            <span
              style="
                font-size: 12px;
                font-weight: 700;
                color: #c2c9d0;
                letter-spacing: 0.06em;
              "
              >{{t.name}}</span
            >
            <span
              data-column="compound"
              title="{{t.compoundName}}"
              style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 3px solid {{t.cc}}; background: #15181D; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #FFFFFF; text-shadow: none"
              >{{t.compound}}</span
            >
          </div>
          <span
            data-column="wear"
            class="mono"
            style="font-size: 24px; font-weight: 700; line-height: 1.05; color: {{t.lifeFg}}"
            >{{t.lifePct}}<span style="font-size: 14px">%</span></span
          >
          <div
            data-column="wear"
            style="
              height: 5px;
              border-radius: 3px;
              background: rgba(0, 0, 0, 0.5);
              overflow: hidden;
            "
          >
            <div
              style="width: 100%; height: 100%; background: {{t.lifeFg}}; transform-origin: left center; transform: scaleX({{t.life}})"
            ></div>
          </div>
          <span style="flex: 1"></span>
          <div
            style="
              display: flex;
              align-items: baseline;
              gap: 6px;
              font-size: 11px;
              font-weight: 600;
              color: #c2c9d0;
            "
          >
            <span
              data-column="temperature"
              class="mono"
              style="font-weight: 700; color: {{t.tempFg}}"
              >{{t.avg}}°</span
            >
            <span data-column="age">{{t.laps}} laps</span>
          </div>
          <sc-if
            data-column="condition"
            value="{{t.marked}}"
            hint-placeholder-val="{{ false }}"
          >
            <span
              title="{{t.conditionTitle}}"
              style="font-size: 11px; font-weight: 600; color: #ff9f96"
              >{{t.conditionText}}</span
            >
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>
</div>
